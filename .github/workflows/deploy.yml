name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name_lc: ${{ steps.meta.outputs.image_name_lc }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests clean package

      - name: Prepare metadata
        id: meta
        run: |
          echo "image_name_lc=${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name_lc }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name_lc }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,deploy/Caddyfile"
          target: "/opt/bank-app"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME_LC: ${{ needs.build-and-push.outputs.image_name_lc }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_NAME_LC,IMAGE_TAG,APP_DOMAIN,ACME_EMAIL,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,GHCR_USERNAME,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/opt/bank-app"
            mkdir -p "$APP_DIR/secrets"
            mkdir -p "$APP_DIR/deploy"

            cat > "$APP_DIR/.env" <<EOF
            IMAGE_NAME=${IMAGE_NAME_LC}
            IMAGE_TAG=${IMAGE_TAG}
            APP_DOMAIN=${APP_DOMAIN}
            ACME_EMAIL=${ACME_EMAIL}
            EOF

            printf "%s" "${SPRING_DATASOURCE_URL}" > "$APP_DIR/secrets/spring.datasource.url"
            printf "%s" "${SPRING_DATASOURCE_USERNAME}" > "$APP_DIR/secrets/spring.datasource.username"
            printf "%s" "${SPRING_DATASOURCE_PASSWORD}" > "$APP_DIR/secrets/spring.datasource.password"

            chmod 600 "$APP_DIR/.env" "$APP_DIR/secrets/"*

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.prod.yml" pull
            docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.prod.yml" up -d --remove-orphans
