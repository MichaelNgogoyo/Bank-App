<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/theme-head :: themeHead('Transaction History - Equity Bank')"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="#">Equity Bank</a>
    <div class="ml-auto nav-actions">
        <button type="button" class="theme-toggle" id="themeToggle" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
            <i class="fas fa-moon" id="themeIcon" data-theme-icon></i>
        </button>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
            <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="transactions-shell">
    <div class="container transactions-container">
        <div class="page-card">
            <h2 class="text-center">Transaction History</h2>
            <div class="table-responsive table-custom">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.type}"></td>
                        <td th:text="${transaction.amount}"
                            th:classappend="${transaction.type.contains('Transfer In') || transaction.type == 'Deposit'} ? 'text-success' : 'text-danger'">
                            <span th:text="${transaction.type.contains('Transfer In') || transaction.type == 'Deposit'} ? '+$' + transaction.amount : '-$' + transaction.amount"></span>
                        </td>
                        <td th:text="${transaction.timeStamp}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <p class="text-center mt-4 mb-0"><a href="/dashboard" class="custom-link">Back to Dashboard</a></p>
        </div>
    </div>
</div>

<footer class="footer">
    <p class="mb-0">&copy; 2024 Equity Bank. Transaction history and account activity.</p>
</footer>

</body>
</html>
