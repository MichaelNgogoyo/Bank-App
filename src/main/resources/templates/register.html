<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Equity Bank</title>
    <script>
        (function () {
            const key = 'equity-theme';
            const stored = localStorage.getItem(key);
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored === 'light' || stored === 'dark' ? stored : (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        }());
    </script>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/css/equity-theme.css">
    <script src="/js/equity-theme.js" defer></script>
    <style>
        body {
            background: var(--color-background) !important;
            color: var(--color-text) !important;
        }

        .auth-shell {
            background: var(--color-background);
        }

        .auth-card {
            background: var(--color-surface-elevated) !important;
            color: var(--color-text) !important;
        }

        .auth-card label,
        .auth-card p,
        .auth-card .custom-link,
        .auth-card .form-control,
        .auth-card .auth-subtitle {
            color: var(--color-text) !important;
        }

        .auth-title,
        .auth-card h2,
        .auth-card h3,
        .auth-card .auth-badge {
            color: var(--color-heading) !important;
        }

        .form-control {
            background: var(--color-input-background) !important;
            border-color: var(--color-border) !important;
        }

        .btn-primary {
            background: var(--color-primary) !important;
            border-color: var(--color-primary) !important;
            color: var(--color-primary-text) !important;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: var(--color-primary-hover) !important;
            border-color: var(--color-primary-hover) !important;
        }

        .custom-link,
        .footer a {
            color: var(--color-primary) !important;
        }

        .custom-link:hover,
        .footer a:hover {
            color: var(--color-primary-hover) !important;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="#">Equity Bank</a>
    <div class="ml-auto nav-actions">
        <button type="button" class="theme-toggle" id="themeToggle" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
            <i class="fas fa-moon" id="themeIcon" data-theme-icon></i>
        </button>
        <div class="social-icons">
            <a href="#" title="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
    </div>
</nav>

<div class="auth-shell">
    <div class="auth-card">
        <span class="auth-badge"><i class="fas fa-user-plus"></i> New account</span>
        <h2 class="auth-title text-center">Register a New Account</h2>
        <p class="auth-subtitle text-center">Create an account in a polished Equity-inspired layout.</p>

        <form method="post" action="/register">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" class="form-control" name="username" required />
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" class="form-control" name="password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">Already have an account? <a href="/login" class="custom-link">Login here</a></p>

        <div th:if="${error}" class="alert alert-danger mt-3 text-center">
            User already present.
        </div>
    </div>
</div>

<footer class="footer">
    <p class="mb-0">&copy; 2024 Equity Bank. All rights reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
</footer>

</body>
</html>
