<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Equity Bank</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        :root {
            --equity-green: #006a4e;
            --equity-green-dark: #004d39;
            --equity-red: #d72638;
            --equity-red-soft: #fbe4e7;
            --surface: rgba(255, 255, 255, 0.92);
            --text: #10312b;
            --border: rgba(0, 106, 78, 0.14);
            --shadow: 0 24px 50px rgba(16, 49, 43, 0.16);
        }

        * { box-sizing: border-box; }

        body[data-theme="dark"] {
            --surface: rgba(10, 18, 16, 0.88);
            --text: #e8f3ef;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 24px 50px rgba(0, 0, 0, 0.36);
            background:
                radial-gradient(circle at top left, rgba(215, 38, 56, 0.16), transparent 28%),
                radial-gradient(circle at bottom right, rgba(0, 106, 78, 0.22), transparent 34%),
                linear-gradient(135deg, #07110f 0%, #0d1a17 52%, #101f1c 100%);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(215, 38, 56, 0.14), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0, 106, 78, 0.18), transparent 34%),
                linear-gradient(135deg, #eef7f3 0%, #ffffff 52%, #f4fbf8 100%);
        }

        .navbar-custom {
            background: linear-gradient(90deg, var(--equity-green-dark), var(--equity-green));
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.2);
        }

        .navbar-custom .social-icons a {
            color: rgba(255, 255, 255, 0.9);
            margin-left: 14px;
            font-size: 1.05rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .navbar-custom .social-icons a:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .auth-shell {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px 72px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            padding: 34px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--equity-red-soft);
            color: var(--equity-red);
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .auth-title {
            margin: 16px 0 8px;
            font-weight: 800;
            color: var(--equity-green-dark);
        }

        .auth-subtitle {
            margin-bottom: 26px;
            color: rgba(16, 49, 43, 0.75);
        }

        .form-group label {
            color: var(--equity-green-dark);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(0, 106, 78, 0.18);
            background: rgba(255, 255, 255, 0.95);
            color: var(--text);
            box-shadow: none;
        }

        .form-control:focus {
            border-color: var(--equity-green);
            box-shadow: 0 0 0 0.2rem rgba(0, 106, 78, 0.14);
        }

        .btn {
            min-height: 48px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--equity-red), #b81828);
            border: none;
            box-shadow: 0 12px 22px rgba(215, 38, 56, 0.22);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #c51f31, #a91423);
        }

        .custom-link {
            color: var(--equity-green);
            font-weight: 700;
            text-decoration: none;
        }

        .custom-link:hover {
            color: var(--equity-red);
            text-decoration: underline;
        }

        .alert-danger {
            border: none;
            background: rgba(215, 38, 56, 0.1);
            color: #a11423;
            border-radius: 12px;
        }

        .footer {
            background: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(0, 106, 78, 0.12);
            color: rgba(16, 49, 43, 0.8);
            padding: 14px 0;
            font-size: 14px;
            text-align: center;
        }

        .footer a {
            color: var(--equity-green);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            color: var(--equity-red);
        }

        body[data-theme="dark"] .auth-card,
        body[data-theme="dark"] .footer {
            background: rgba(7, 17, 15, 0.88);
        }

        body[data-theme="dark"] .auth-card,
        body[data-theme="dark"] .auth-card h2,
        body[data-theme="dark"] .auth-card p,
        body[data-theme="dark"] .auth-card label,
        body[data-theme="dark"] .auth-card a,
        body[data-theme="dark"] .footer,
        body[data-theme="dark"] .footer a {
            color: #e8f3ef;
        }

        body[data-theme="dark"] .form-control {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.14);
        }

        body[data-theme="dark"] .auth-subtitle,
        body[data-theme="dark"] .footer {
            color: rgba(232, 243, 239, 0.78);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="#">Equity Bank</a>
    <div class="ml-auto nav-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <div class="social-icons">
        <a href="#" title="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="#" title="LinkedIn">
            <i class="fab fa-linkedin"></i>
        </a>
        </div>
    </div>
</nav>

<div class="auth-shell">
    <div class="auth-card">
        <span class="auth-badge"><i class="fas fa-user-plus"></i> New account</span>
        <h2 class="auth-title text-center">Register a New Account</h2>
        <p class="auth-subtitle text-center">Create an account in a polished Equity-inspired layout.</p>

        <form method="post" action="/register">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" class="form-control" name="username" required />
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" class="form-control" name="password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">Already have an account? <a href="/login" class="custom-link">Login here</a></p>

        <div th:if="${error}" class="alert alert-danger mt-3 text-center">
            User already present.
        </div>
    </div>
</div>

<footer class="footer">
    <p class="mb-0">&copy; 2024 Equity Bank. All rights reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
</footer>

<script>
    (function () {
        const key = 'equity-theme';
        const body = document.body;
        const button = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');

        function applyTheme(theme) {
            body.setAttribute('data-theme', theme);
            const dark = theme === 'dark';
            icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
            button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
            button.title = dark ? 'Light mode' : 'Dark mode';
        }

        applyTheme(localStorage.getItem(key) || 'light');
        button.addEventListener('click', function () {
            const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem(key, next);
            applyTheme(next);
        });
    }());
</script>

</body>
</html>
